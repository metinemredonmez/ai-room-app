# CI gate (OPS): secrets scan, backend + AI service tests, end-to-end smoke, dependency audit, SBOM.
# Actions are pinned to commit SHAs (supply chain); Dependabot keeps them current.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # weekly: catches new advisories for unchanged dependencies

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  ai-service:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/ai-service/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --no-hashes --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --disable-pip --no-deps --strict -r "$RUNNER_TEMP/requirements.txt"

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: airoom
          POSTGRES_DB: airoom
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway CI database, reachable only from this job
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U airoom"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/ai-service/uv.lock

      - name: Write throwaway CI configuration
        run: |
          rand() { openssl rand -hex 32; }
          token=$(rand)
          cat > .env <<EOF
          NODE_ENV=development
          DATABASE_URL=postgresql://airoom@localhost:5432/airoom
          REDIS_URL=redis://localhost:6379/0
          JWT_SECRET=$(rand)
          IMAGE_URL_SECRET=$(rand)
          DEVICE_PEPPER=$(rand)
          AI_INTERNAL_TOKEN=$token
          AI_SERVICE_URL=http://127.0.0.1:8001
          DATA_DIR=./data
          REVENUECAT_WEBHOOK_SECRET=$(rand)
          REVENUECAT_WEBHOOK_AUTH=Bearer $(rand)
          EOF
          printf 'ENV=development\nINTERNAL_TOKEN=%s\nIMAGE_PROVIDER=mock\n' "$token" > ../ai-service/.env
          chmod 600 .env ../ai-service/.env

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

      - name: Database
        run: |
          npx prisma migrate deploy
          npm run db:seed
      - name: Install AI service
        working-directory: apps/ai-service
        run: uv sync --locked
      - name: Start AI service and backend
        run: |
          (cd ../ai-service && nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8001 --no-access-log > "$RUNNER_TEMP/ai.log" 2>&1 &)
          nohup node dist/main.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/healthz >/dev/null && curl -sf http://localhost:4000/v1/health >/dev/null && exit 0
            sleep 1
          done
          echo "services did not become healthy"; exit 1
      - name: End-to-end smoke
        run: node ../../scripts/smoke.mjs
      - name: Service logs
        if: failure()
        run: tail -n 150 "$RUNNER_TEMP/backend.log" "$RUNNER_TEMP/ai.log" || true

  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SBOM (CycloneDX, every app's lockfile)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
          upload-artifact-retention: 90
