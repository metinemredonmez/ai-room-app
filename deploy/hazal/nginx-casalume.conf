# Casalume — nginx on hazal (/etc/nginx/sites-available/casalume). Only this file; other sites are untouched.
# First install is port 80 only; `certbot --nginx --cert-name casalume ...` adds the 443 blocks and redirects.
# X-Forwarded-For is overwritten with the address nginx sees, never appended to the client's value: one trusted
# proxy, backend TRUSTED_PROXY_HOPS=1 (NET-03).

server {
    listen 80;
    listen [::]:80;
    server_name api.casalume.app;
    # Photos arrive base64 in JSON (MAX_UPLOAD_MB=10 → ~14 MB body).
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name casalume.app www.casalume.app;
    client_max_body_size 16m;

    # No Server Actions in use: Next-Action probes stop here (log noise + attack surface).
    if ($http_next_action) { return 403; }

    location / {
        proxy_pass http://127.0.0.1:3301;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.casalume.app;
    client_max_body_size 16m;

    if ($http_next_action) { return 403; }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Only so certbot can prove mail.casalume.app (the mail server's certificate); no web content here.
server {
    listen 80;
    listen [::]:80;
    server_name mail.casalume.app;

    location / {
        return 404;
    }
}
